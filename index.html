<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodica – SPARQL</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Apply YASGUI's persisted theme before first paint (its ThemeManager
       sets data-theme on <html> and stores the choice under "yasgui_theme"). -->
  <script>
    (function () {
      var theme = null;
      try {
        var stored = localStorage.getItem("yasgui_theme");
        if (stored) {
          try {
            var parsed = JSON.parse(stored);
            theme = parsed && (parsed.val || parsed.value || parsed);
          } catch (e) {
            theme = stored;
          }
        }
      } catch (e) { /* storage unavailable */ }
      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <!-- Shared design tokens (D19) - same file index.html loads, so the two
       pages cannot visually drift apart. Follows YASGUI's own theme switch:
       its ThemeManager toggles data-theme="light|dark" on <html>. -->
  <link rel="stylesheet" href="assets/theme.css">

  <!-- Open the TLS connections while the HTML is still parsing: the YASGUI
       bundle alone is ~3 MB, and the endpoint is contacted right after it. -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://query.wikidata.org">
  <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>

  <!-- Dependencies (pinned CDN versions). `defer` keeps 3+ MB of JavaScript
       off the parser's critical path, so the header and footer paint while it
       downloads; deferred scripts keep their relative order and all run before
       DOMContentLoaded, which the page script below now waits for. -->
  <link rel="stylesheet" href="https://unpkg.com/@matdata/yasgui@5.20.3/build/yasgui.min.css">
  <script defer src="https://unpkg.com/@matdata/yasgui@5.20.3/build/yasgui.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/n3@1.17.4/browser/n3.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    /* @matdata/yasgui@5.20.3 ships yasgui.min.css referencing a
       "Font Awesome 7 Free" 900 woff2 that isn't actually included in the
       published package (upstream packaging bug: the file 404s on every
       CDN). Without it every toolbar/tab icon renders as a blank square.
       This redeclaration for the exact same family/weight/style wins the
       cascade (it's later in source order) and points at the equivalent,
       CORS-enabled font from the official Font Awesome package instead. */
    @font-face {
      font-family: "Font Awesome 7 Free";
      font-style: normal;
      font-weight: 900;
      font-display: block;
      src: url("https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/webfonts/fa-solid-900.woff2") format("woff2");
    }
    html { background: var(--bg); }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      /* min-height, deliberately NOT height/max-height. Capping <body> to the
         viewport does remove the last overflow case (side-by-side layout on a
         very short window), because flexbox then has to compress - but it
         compresses the wrong things: measured, the graph stopped filling its
         panel (179px of blank) and the Properties toggle ended up off-screen.
         A scrollbar in that one corner is the better trade, so the page is
         allowed to grow instead. See D25 for the case still open. */
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { line-height: 0; margin: 0; color: var(--text); }
    header .sub { color: var(--muted); font-size: 13px; }
    header .spacer { flex: 1; }
    .mode-link { color: var(--link); font-size: 13px; text-decoration: none; white-space: nowrap; }
    .mode-link:hover { text-decoration: underline; }
    #gh-link { display: flex; align-items: center; margin-left: 4px; color: var(--text); opacity: 0.8; transition: opacity 0.15s; }
    #gh-link:hover { opacity: 1; }
    /* Fills the space between header and footer, which is what pins the
       footer to the bottom of the window - for *every* results view, with no
       JavaScript involved. Stretching this wrapper failed when it was first
       tried, but only because YASGUI's own min-heights (released just below)
       were still forcing the widget to 800px; with those gone, its panels
       (.tabPanel/.yasr/.yasr_results all carry flex: 1 1 0% from the library
       itself) distribute the height correctly and the query editor is not
       squeezed - .yasqe is content-sized and stays at its natural height. */
    #yasgui {
      padding: 8px 16px 16px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #yasgui > .yasgui { flex: 1; min-height: 0; }
    /* .yasrWrapperEl is the one link in that chain YASGUI leaves as
       `display: block; flex: 0 1 auto` - it does not grow, so the results
       panel stopped at its content height (185px inside a 563px parent) and
       the graph sat in a pool of blank space above the footer. Everything
       else on the path (.tabPanel, .yasr, .yasr_results) already carries
       flex: 1 1 0% from the library. min-height: 0 on the flex items is what
       lets them shrink below content size instead of overflowing. */
    /* min-height: 0 lets this shrink below its content (needed, so the panel
       can be sized by the layout rather than by the graph). But a floor is
       needed with it: without one the results pane absorbs an over-tall
       editor by collapsing to *zero* and the page reports no overflow at all
       - so fitEditorHeight() below, which triggers on overflow, never fired
       and the graph simply disappeared on short windows. The floor is what
       turns that invisible squeeze into a measurable one. */
    #yasgui .yasrWrapperEl { min-height: 160px; display: flex; flex-direction: column; }
    /* flex: 1 only in vertical - in the fork's Horizontal Layout (hamburger
       menu) the same rule was hijacking the fork's own 50% column split. */
    #yasgui .tabPanel.orientation-vertical .yasrWrapperEl { flex: 1; }
    /* Horizontal Layout puts editor and results side by side, and the fork
       pins the results column to an explicit `height` with !important - at
       results-summary height (59px), it does not stretch to the row. That
       was invisible while the library's .yasr{min-height:400px} propped the
       column open; releasing that minimum (above) is what collapsed the
       graph to 2px and every control with it, IN THIS ORIENTATION ONLY -
       vertical measured fine throughout, which is exactly how the break
       shipped. `auto` + the flexbox default stretch restores the full-height
       column; !important is required to outrank the fork's own !important
       (this stylesheet comes later in the cascade). Verified live: 2px ->
       527px on a 714px-tall window. */
    #yasgui .tabPanel.orientation-horizontal .yasrWrapperEl {
      height: auto !important;
      align-self: stretch;
    }
    /* Side by side, .editorwrapper is a row flex item and so defaults to
       min-height: auto - floored at its own content (584px), which forced
       the whole panel taller than the window and overflowed the page by
       163px on a short one. Released, the column shrinks and the editor's
       .CodeMirror (already flex: 1 1 0% inside .yasqe) takes what is left
       and scrolls internally. Horizontal only: stacked mode deliberately
       keeps the editor at whatever height YASQE or the user's drag set. */
    #yasgui .tabPanel.orientation-horizontal .editorwrapper { min-height: 0; }
    /* Bounds the editor in side-by-side layout only. Safe here in a way it is
       not in stacked layout: the row-resize grip is hidden in this
       orientation (the fork gives you a column splitter instead), so no user
       gesture is being overridden - which is exactly what the cap removed in
       D25 was doing. Needed because the editor's .CodeMirror carries
       flex: 1 1 0% inside .yasqe here, so it grows to the column and ignores
       the inline height, leaving the JS fit with nothing to shrink. The
       longer default query (D26) turned this from one failing size into
       three without it. */
    #yasgui .orientation-horizontal .yasqe .CodeMirror { max-height: calc(100vh - 320px); }
    /* The results panel is a flex column and the graph a flex item in it,
       rather than the graph being height: 100%. A percentage height has to
       resolve against a parent with a *definite* height, and a flex-sized
       parent does not reliably provide one - the graph stayed at 156px
       inside a 296px panel. flex-basis 0 + grow governs the main axis
       outright, so the inline height the plugin writes is bypassed. */
    #yasgui .yasr_results { min-height: 0; display: flex; flex-direction: column; }
    #yasgui .nodica-yasr { flex: 1 1 0; min-height: 0; }
    /* YASR's Response view mounts its CodeMirror as a direct child of
       .yasr_results at content height (min-height: auto floors it there), so
       a long response pushed the whole page 169-247px past the viewport.
       As a flex item with basis 0 it takes exactly the panel's height and
       scrolls internally instead - same treatment as the graph, and no
       viewport arithmetic to get wrong. */
    #yasgui .yasr_results > .CodeMirror { flex: 1 1 0; min-height: 0; }
    /* The two rules below are the ones that actually let the footer sit
       within the viewport; without them nothing else here can (D22).

       YASGUI's stylesheet carries two hard minimums - .yasgui 800px and
       .yasr 400px - which pinned the document at 51 (header) + 8 + 800 + 16
       + 29 (footer) = 904px however small its contents were. That is why
       shrinking the graph moved the page height by exactly nothing. This
       *removes* an artificial minimum so ordinary content sizing applies; it
       sets no flex property and does not restructure anything, which is what
       separates it from the stretch attempt rejected above. */
    #yasgui > .yasgui { min-height: 0; }
    #yasgui .yasr { min-height: 0; }
    /* NO max-height or overflow on the query editor's .CodeMirror - both were
       tried here and both were mistakes, on a false premise: the editor was
       said to "auto-grow to every line with no internal scrollbar". It does
       neither. YASQE ships it at a 300px default (inline `height: 300px`)
       and CodeMirror already scrolls internally (.CodeMirror-scroll, its own
       overflow). The cap therefore:
         - broke YASQE's drag-to-resize (.horizontalResizeWrapper, the
           row-resize grip under the editor). The handle sets that inline
           height; a stylesheet max-height silently overrode every drag, so
           the editor could not be enlarged to read a long query;
         - produced TWO scrollbars - CodeMirror's own, plus a second native
           one from the `overflow-y: auto` added on the wrapper.
       The editor's height is YASQE's business and the user's; the flex rules
       above already stop it from breaking the page, because .yasrWrapperEl
       carries min-height: 0 and simply yields the space. */
    /* YASQE indents this one toolbar row by its own 10px padding, which put
       "Query Types"/"Patterns" at x=26 while every other row in the column -
       the query tab bar, the YASR plugin tabs, the editor's gutter, and both
       panel borders - sits flush at x=16. Zeroed horizontally only, so the
       row keeps its vertical breathing room. */
    #yasgui .yasqe_snippetsBar { padding-left: 0; padding-right: 0; }
    footer {
      /* A card on the same 16px column as the panels above it, rather than a
         full-bleed bar: bordered on all four sides (the graph panel is too, so
         a rule on top alone read as unfinished), with an equal 16px gap left,
         right and below.
         Margin, not padding, sets the alignment - the border has to move with
         the box; the text alone was already at 16px and still looked wrong.
         The 10px inner padding is what keeps the text off its own border, and
         matches how the plugin's Properties button sits 10px inside the graph
         panel: it's the *border* that aligns to the column, not the text.
         NOTE: fitGraphHeight() has to read this bottom margin explicitly,
         because margins fall outside the border box and would otherwise
         escape its measurement and reintroduce the scrollbar. */
      margin: 0 16px 16px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    footer a { color: var(--link); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    /* The Nodica graph container created by the plugin. These custom
       properties are the plugin's public theming hook (D16-D19): it reads
       them by these exact names (never our own --panel/--text/etc.) so it
       stays portable to any host, not just this page. Aliasing them here
       to our own tokens is what keeps file mode and SPARQL mode matching. */
    .nodica-yasr {
      background: var(--panel);
      border: 1px solid var(--border);
      --nodica-label-color: var(--text);
      --nodica-label-background: var(--panel);
      --nodica-btn-bg: var(--btn-secondary-bg);
      --nodica-btn-text: var(--btn-secondary-text);
      --nodica-btn-hover: var(--btn-secondary-hover);
      --nodica-accent-bg: var(--btn-graph-bg);
      --nodica-accent-hover: var(--btn-graph-bg-hover);
      --nodica-link: var(--link);
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <!-- inline logo: letters follow the theme, the red "o" stays brand red -->
      <svg width="111" height="34" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nodica">
        <text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="700" fill="currentColor" letter-spacing="-1">n<tspan fill="#E23B2E">o</tspan>dica</text>
      </svg>
    </h1>
    <span class="sub">SPARQL results as an image-filled graph (CONSTRUCT / DESCRIBE)</span>
    <span class="spacer"></span>
    <a class="mode-link" href="file-mode.html" title="Switch to file mode: paste, upload or fetch RDF files and configure the graph">File mode</a>
    <a id="gh-link" href="https://github.com/kvistgaard/nodica" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub" title="View source on GitHub">
      <svg width="26" height="26" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </header>

  <div id="yasgui"></div>

  <footer>
    SPARQL editor: <a href="https://matdata.eu" target="_blank" rel="noopener noreferrer">Matdata&#8217;s</a> <a href="https://github.com/Matdata-eu/Yasgui" target="_blank" rel="noopener noreferrer">YASGUI</a>.
    Graph rendering: <a href="https://github.com/kvistgaard/nodica" target="_blank" rel="noopener noreferrer">Nodica</a>.
  </footer>

  <script defer src="src/nodica.js"></script>
  <script defer src="src/nodica-yasr-plugin.js"></script>
  <script>
    // Deferred scripts run before DOMContentLoaded, so waiting for it is what
    // lets everything above be deferred (an inline script runs immediately and
    // would find Yasgui undefined).
    document.addEventListener("DOMContentLoaded", function () {
      "use strict";

      // The plugin self-registers on load; this is a safety net in case the
      // script order above ever changes.
      if (!(Yasgui.Yasr.plugins && Yasgui.Yasr.plugins.nodica)) {
        NodicaYasrPlugin.register();
      }

      // Demo configuration (D8: inline configTurtle) — English labels, node
      // click opens the entity's wiki page (D11).
      //
      // Deliberately does NOT set cfg:imageProperty: the default query marks
      // it with `# nodica:image` instead (D26), and setting it here too would
      // make the marker redundant - the graph would look identical with the
      // marker deleted, so the convention could neither be seen working nor
      // be caught failing. Leaving it out is also the data-centric choice:
      // the query says which property fills the nodes, and the page does not
      // second-guess it. Remove the marker and D6 auto-detection still finds
      // an image property, so nothing breaks - it simply stops being stated.
      var DEMO_CONFIG = [
        '@prefix cfg: <https://kvistgaard.github.io/config#> .',
        '',
        '<#sparql-demo> a cfg:Configuration ;',
        '    cfg:labelProperty <http://www.w3.org/2000/01/rdf-schema#label> ;',
        '    cfg:nodeSize 60 ;',
        '    cfg:edgeLength 250 ;',
        '    cfg:dereferenceRule [',
        '        cfg:uriPrefix "http://www.wikidata.org/entity/" ;',
        '        cfg:template  "https://www.wikidata.org/wiki/{LOCAL}"',
        '    ] .',
      ].join("\n");

      // The query's source of truth is the file `examples/influences.rq` (D28):
      // a query is an artifact - openable, runnable elsewhere, diffable -
      // and keeping only a copy pasted into a <script> would be the same
      // drift trap the cfg: vocabulary exists to avoid. It is fetched below.
      //
      // This inline copy is the `file://` fallback, where fetch cannot reach
      // a sibling file at all - the identical arrangement settings.ttl and
      // DEFAULT_CONFIG have had since D10. A test asserts the two match, so
      // the copy cannot quietly drift from the file.
      //
      // Its shape is as authored: pattern order and the label FILTERs were
      // measured against Wikidata rather than tuned by eye, and every rewrite
      // tried was equal or worse - hand-ordering the patterns made no
      // measurable difference (Blazegraph reorders them itself), and moving
      // the label joins behind a LIMIT subquery, which should have cut the
      // multiplicative work, timed out at 65s against ~0.8s. See D26.
      var DEFAULT_QUERY_INLINE = [
        'PREFIX wd:       <http://www.wikidata.org/entity/>',
        'PREFIX wdt:      <http://www.wikidata.org/prop/direct/>',
        'PREFIX rdfs:     <http://www.w3.org/2000/01/rdf-schema#>',
        'PREFIX xsd:      <http://www.w3.org/2001/XMLSchema#>',
        'PREFIX wikibase: <http://wikiba.se/ontology#>',
        '',
        '# Influences among people in the age Enlightenment (1590-1750).',
        '# Nodica draws CONSTRUCT/DESCRIBE results; try your own graph queries.',
        '#',
        '# The "# nodica:image" marker below tells Nodica which property fills the nodes',
        'CONSTRUCT {',
        '  ?a wdt:P737 ?b .',
        '  ?a wdt:P18 ?aImage .            # nodica:image',
        '  ?b wdt:P18 ?bImage .',
        '  ?a rdfs:label ?aLabel .',
        '  ?b rdfs:label ?bLabel .',
        '  wdt:P737 rdfs:label ?propertyLabel .',
        '}',
        'WHERE {',
        '  ?a wdt:P31 wd:Q5 ;',
        '     wdt:P569 ?birth ;',
        '     wdt:P737 ?b .',
        '  ?b wdt:P31 wd:Q5 .',
        '  ?a wdt:P18 ?aImage .',
        '  ?b wdt:P18 ?bImage .',
        '  FILTER (?birth > "1590-01-01"^^xsd:dateTime && ?birth < "1750-01-01"^^xsd:dateTime)',
        '  ?a rdfs:label ?aLabel .',
        '  ?b rdfs:label ?bLabel .',
        '  ?property wikibase:directClaim wdt:P737 ;',
        '            rdfs:label ?propertyLabel .',
        '  FILTER (LANG(?propertyLabel) = "en")',
        '  FILTER (LANG(?aLabel) = "en")',
        '  FILTER (LANG(?bLabel) = "en")',
        '}',
        'LIMIT 50',
      ].join("\n");

      var DEFAULT_QUERY = DEFAULT_QUERY_INLINE;

      /**
       * Read the query from its file, falling back to the inline copy.
       *
       * Everything below has to wait for this, because YASQE's default value
       * must be set before the Yasgui instance is constructed. Measured cost
       * of that wait (same-origin, ~1 KB, and it happens after the 3 MB
       * bundle has already loaded): the request itself takes **5-9 ms**.
       * End-to-end editor-ready medians over 5 runs were 1183 ms inline vs
       * 1233 ms fetched, but the spreads overlap (1134-1297 vs 1134-1332),
       * so the difference is not distinguishable from run-to-run noise.
       * A `file://` page rejects the fetch immediately and uses the inline
       * copy, so opening from disk is not slowed either.
       */
      function loadDefaultQuery() {
        try {
          return fetch("examples/influences.rq", {
            headers: { Accept: "application/sparql-query, text/plain" },
          })
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.text();
            })
            .then(function (text) {
              text = String(text).replace(/\r\n/g, "\n").replace(/\s+$/, "");
              // A truncated or wrong file must not replace a working query.
              if (text === "" || text.indexOf("CONSTRUCT") === -1) {
                throw new Error("not a CONSTRUCT query");
              }
              return text;
            })
            .catch(function () { return DEFAULT_QUERY_INLINE; });
        } catch (e) {
          // fetch itself can throw synchronously on some file:// engines.
          return Promise.resolve(DEFAULT_QUERY_INLINE);
        }
      }

      loadDefaultQuery().then(function (queryText) {
        DEFAULT_QUERY = queryText;
        start();
      });

      function start() {
      // Static defaults must be set before the Yasgui instance is created.
      // The 5.20.3 bundle registers: Table, Graph, Geo, response, boolean, error.
      var Yasr = Yasgui.Yasr;
      var order = ["nodica"].concat(
        ["Table", "Graph", "response", "boolean", "error"].filter(function (name) {
          return Yasr.plugins && Yasr.plugins[name];
        })
      );
      Yasr.defaults.pluginOrder = order;
      Yasr.defaults.defaultPlugin = "nodica";
      Yasr.defaults.plugins.nodica = {
        enabled: true,
        // "100%" so the graph fills the results panel, which flexbox has
        // already stretched to the available height (see the #yasgui rules
        // in <style>). A fixed pixel height here is what made this page need
        // a JS fit at all.
        dynamicConfig: { configTurtle: DEMO_CONFIG, height: "100%" },
      };
      Yasgui.Yasqe.defaults.value = DEFAULT_QUERY;

      var yasgui = new Yasgui(document.getElementById("yasgui"), {
        requestConfig: {
          endpoint: "https://query.wikidata.org/sparql",
          // CONSTRUCT/DESCRIBE responses arrive as Turtle -> Nodica.parseRdf.
          acceptHeaderGraph: "text/turtle",
        },
        copyEndpointOnNewTab: true,
      });

      // NOTE: page height is handled entirely in CSS (see the #yasgui flex
      // rules in <style>). An earlier version measured the graph's position
      // in JS and set an explicit pixel height on it. That was wrong twice
      // over: it had to enumerate everything sitting between the graph and
      // the end of the document (it forgot #yasgui's bottom padding, then
      // later the footer's bottom margin - each one a silent 16px of
      // scrollbar), and it only ever sized `.nodica-yasr`, so selecting any
      // other YASR view (Table, Response) or opening a new tab left nothing
      // holding the page open and the footer rode up by 200-440px. Letting
      // flexbox own the vertical layout removes both failure modes: the
      // footer is pinned by the layout itself, for every view, with no
      // measurement to get wrong.

      // The one thing CSS must NOT do here is bound the query editor: YASQE
      // resizes it by writing an inline height (the row-resize grip under
      // the editor), and any stylesheet max-height silently overrides every
      // drag. So its *starting* height is set instead - a preference, which
      // the grip then owns - leaving the layout invariant itself in CSS.
      //
      // YASQE's 300px default does not fit a short window (a 1366x768 laptop
      // gives the browser ~620px of content height, and the page came out
      // ~110px over). Rather than enumerate what else is on the page - the
      // habit that produced two separate silent 16px scrollbars earlier -
      // this reads the overflow the browser actually reports and takes that
      // much off the editor. Self-correcting, and it cannot omit a term.
      // Shrink-only: it never grows the editor, so a height the user chose
      // by dragging is never overwritten on their behalf.
      // Once the user drags the grip, the editor's height is theirs and this
      // stops touching it - including when that means the page scrolls,
      // which is a fair consequence of asking for a taller editor on a short
      // window. Without this the auto-fit immediately undid every drag (a
      // 120px drag measured 223px -> 223px), which is the very bug the fit
      // was added alongside fixing.
      var userSizedEditor = false;
      document.getElementById("yasgui").addEventListener("pointerdown", function (e) {
        var t = e.target;
        if (t && t.closest && t.closest(".horizontalResizeWrapper")) userSizedEditor = true;
      }, true);

      function fitEditorHeight() {
        if (userSizedEditor) return;
        // Scoped to the ACTIVE tab: YASGUI keeps every open tab's editor in
        // the DOM, so a bare `.yasqe .CodeMirror` returns whichever tab is
        // first - resizing a hidden editor and leaving the visible one to
        // overflow the page (seen on a newly opened tab, 77px over).
        var cmEl = document.querySelector(".tabPanel.active .yasqe .CodeMirror") ||
          document.querySelector(".yasqe .CodeMirror");
        var cm = cmEl && cmEl.CodeMirror;
        if (!cm) return;
        var overflow = document.documentElement.scrollHeight - window.innerHeight;
        if (overflow <= 0) return;
        var current = cmEl.getBoundingClientRect().height;
        var target = Math.max(120, Math.round(current - overflow));
        // No-op when already there, so the style-attribute observer below
        // cannot ping-pong with this function once it has converged (or once
        // the 120px floor is reached and the overflow can no longer shrink).
        if (Math.abs(target - current) < 1) return;
        cm.setSize(null, target + "px");
      }
      var editorFitScheduled = false;
      function scheduleEditorFit() {
        if (editorFitScheduled) return;
        editorFitScheduled = true;
        requestAnimationFrame(function () {
          editorFitScheduled = false;
          fitEditorHeight();
        });
      }
      scheduleEditorFit();
      window.addEventListener("resize", scheduleEditorFit);

      // D26: the query carries its own presentation. A YASR plugin cannot see
      // the query (its `yasr` exposes results, config and DOM, and nothing
      // leading back to the editor - verified), so the host reads the marker
      // and hands the result to the plugin, which merges it over the page
      // config. Re-read on every editor change, not just on Run, so that
      // editing the marker and re-running uses the marker as it stands.
      function applyQueryDirectives() {
        try {
          var tab = yasgui.getTab();
          var plugin = tab && tab.getYasr() && tab.getYasr().plugins &&
            tab.getYasr().plugins.nodica;
          if (!plugin || typeof plugin.setQuerySettings !== "function") {
            console.warn("Nodica: no plugin instance to receive query directives");
            return;
          }
          // Only act on a query we actually have. While YASGUI re-renders a
          // tab, getQuery() briefly returns "" - and a re-read at that instant
          // was overwriting the parsed marker with {}, so the graph fell back
          // to the page default (traced: five correct updates, then one empty
          // one immediately before the draw that used it). An empty *string*
          // is absence of information, not an instruction to forget; an empty
          // *result* from a real query still applies, so deleting a marker
          // takes effect.
          var query = tab.getQuery();
          if (typeof query !== "string" || query.trim() === "") return;
          plugin.setQuerySettings(Nodica.parseQueryDirectives(query));
        } catch (e) {
          // Never silent: swallowing this hid a wiring bug behind a graph that
          // simply used the wrong property, which looks like data, not a fault.
          console.warn("Nodica: could not apply query directives:", e && e.message);
        }
      }
      var directivesScheduled = false;
      function scheduleDirectives() {
        if (directivesScheduled) return;
        directivesScheduled = true;
        requestAnimationFrame(function () {
          directivesScheduled = false;
          applyQueryDirectives();
        });
      }
      // Bind to the active editor's CodeMirror; flagged so re-binding on tab
      // switches (via the observer below) cannot stack duplicate listeners.
      function bindEditorChanges() {
        var cmEl = document.querySelector(".tabPanel.active .yasqe .CodeMirror");
        var cm = cmEl && cmEl.CodeMirror;
        if (!cm || cmEl.getAttribute("data-nodica-bound") === "1") return;
        cmEl.setAttribute("data-nodica-bound", "1");
        cm.on("change", scheduleDirectives);
      }
      bindEditorChanges();
      applyQueryDirectives();
      // Switching between stacked and side-by-side layout changes the height
      // budget completely (the fork rewrites .tabPanel's orientation class),
      // and a height that fitted one can overflow the other by ~160px. The
      // class attribute is the signal; rAF coalescing keeps the refit to one
      // per frame however many class changes YASGUI makes.
      // `style` as well as `class`: YASQE writes the editor's height inline,
      // and in side-by-side mode it does so *after* the orientation class
      // lands, so a class-only trigger measured a stale layout and left ~20px
      // of overflow behind. Watching the height it actually writes closes
      // that gap; fitEditorHeight()'s no-op guard keeps our own writes from
      // feeding back into a loop.
      new MutationObserver(function () {
        scheduleEditorFit();
        bindEditorChanges();   // a switched-to or newly opened tab has its own editor
        scheduleDirectives();
      }).observe(
        document.getElementById("yasgui"),
        { attributes: true, attributeFilter: ["class", "style"], subtree: true, childList: true }
      );

      // Run the demo query on a first visit, so the page shows a graph like
      // file mode does with its built-in sample - but only then. YASGUI
      // restores the user's own tabs and their last results from
      // localStorage, and re-running those on every page load meant a slow
      // endpoint round-trip on each visit, for a query the user did not ask
      // to repeat and whose results were already there.
      var tab = yasgui.getTab();
      if (tab && !hasStoredResults(tab) && isUntouchedDemo(tab)) {
        tab.query().catch(function () { /* endpoint hiccup; Run button still works */ });
      }
      } // end start()

      /** True when YASGUI restored a response for this tab (Yasr sets
       *  `results` from storage in its own constructor). */
      function hasStoredResults(t) {
        try {
          var results = t.getYasr() && t.getYasr().results;
          return !!(results && results.getOriginalResponseAsString &&
            results.getOriginalResponseAsString());
        } catch (e) {
          return false;
        }
      }

      /** True only while the tab still holds the demo query verbatim, so a
       *  query the user wrote or edited is never re-executed behind them. */
      function isUntouchedDemo(t) {
        try {
          return t.getQuery().trim() === DEFAULT_QUERY.trim();
        } catch (e) {
          return false;
        }
      }
    });
  </script>
</body>
</html>
